name: CI — Build, Lint & Test

on:
  push:
    branches:
      - main
      - dev
      - islahuddin
      - "feature/**"
      - "fix/**"
      - "feat/**"
  pull_request:
    branches:
      - main
      - dev

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Generate Prisma clients
        run: npm run generate:all
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inventory?schema=public
          MASTER_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inventory_master?schema=public

      - name: Lint
        run: npm run lint -- --max-warnings=9999

      - name: Unit + golden-rule tests
        run: npm test

      - name: API smoke e2e (401/403/400/200/409)
        run: npm run test:e2e:smoke

      - name: Build backend
        run: npx nest build -p tsconfig.build.json
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inventory?schema=public
          MASTER_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inventory_master?schema=public

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit Tests
        run: npm test

      - name: Build frontend (Next.js)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
          NEXTAUTH_SECRET: ci-dummy-secret-32-chars-min-here
          NEXTAUTH_URL: http://localhost:3000

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright critical screens
        run: npm run test:e2e
        env:
          CI: true
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
          NEXTAUTH_SECRET: ci-dummy-secret-32-chars-min-here
          NEXTAUTH_URL: http://127.0.0.1:3000

  docker-build:
    name: Validate Docker Images
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: backend-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: frontend-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-gate:
    name: CI Gate (all checks passed)
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, docker-build]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.backend-ci.result }}" != "success" ]]; then
            echo "Backend CI failed"
            exit 1
          fi
          if [[ "${{ needs.frontend-ci.result }}" != "success" ]]; then
            echo "Frontend CI failed"
            exit 1
          fi
          if [[ "${{ needs.docker-build.result }}" != "success" ]]; then
            echo "Docker build failed"
            exit 1
          fi
          echo "All CI checks passed — safe to merge"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, docker-build, ci-gate]

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /app/factory_distribution_system
            git pull origin main
            docker-compose down
            docker-compose up -d --build
