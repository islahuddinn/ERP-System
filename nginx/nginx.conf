# =============================================================================
# Nginx Reverse Proxy Configuration
# Factory Distribution System — Production
# =============================================================================
# Routes:
#   Port 80  → HTTP (redirects to HTTPS in production)
#   Port 443 → HTTPS (SSL termination)
#   /api/*   → backend:5000
#   /*       → frontend:3000
# =============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Performance
    sendfile        on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ---------------------------------------------------------------------------
    # Upstream Services (Docker internal DNS)
    # ---------------------------------------------------------------------------
    upstream backend_api {
        server backend:5000;
    }

    upstream frontend_app {
        server frontend:3000;
    }

    # ---------------------------------------------------------------------------
    # HTTP Server — Redirect all traffic to HTTPS
    # Comment out the redirect block and use the HTTP block below for dev/no-SSL
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # ✅ For production with SSL: uncomment the redirect below
        # return 301 https://$host$request_uri;

        # ✅ For development / no SSL: use this block instead
        location /api/ {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
        }

        location / {
            proxy_pass         http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ---------------------------------------------------------------------------
    # HTTPS Server — Uncomment when SSL certificates are available
    # Place your certs in ./nginx/certs/
    # ---------------------------------------------------------------------------
    # server {
    #     listen 443 ssl;
    #     server_name yourdomain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
